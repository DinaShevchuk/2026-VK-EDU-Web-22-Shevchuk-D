{% extends 'layouts/base.html' %}
{% block content %}
<div class="col-8 d-flex flex-column">
    <div class="d-flex gap-3 align-items-center">
        <h1>Login</h1>
        <a href="#">Sign up</a>
    </div>
    <div class="card">
            <div class="card-body">
                <div class="row mb-3">
                    <label for="inputLogin" class="col-sm-2 col-form-label" style="white-space: normal; word-break: normal; overflow-wrap: normal;">login</label>
                    <div class="col-sm-10">
                        <input type="text" name="username" class="form-control" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <label for="inputPassword" class="col-sm-2 col-form-label" style="white-space: normal; word-break: normal; overflow-wrap: normal;">Password</label>
                    <div class="col-sm-10">
                        <input type="password" name="password" class="form-control" required>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="LogIn" class="btn">Log in!</button>
                    <button type="CreateNew" class="btn">Create new account</button>
                </div>
            </div>
        </div>
</div>
{% endblock %}
