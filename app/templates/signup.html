{% extends 'layouts/base.html' %}
{% load static %}
{% block content %}
<div class="col-8 d-flex flex-column">
    <div class="d-flex gap-3 align-items-center">
        <h1>Sign Up</h1>
        <a href="{% url 'index' %}">Main</a>
    </div>
    <div class="card">
        <div class="card-body">
            {% if error %}
                <div class="alert alert-custom">
                    {{ error }}
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="row mb-3">
                    <label class="col-sm-3 text_in_card">Username*</label>
                    <div class="col-sm-8">
                        <input type="text" name="username" class="form-control w-75" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-3 text_in_card">Email*</label>
                    <div class="col-sm-8">
                        <input type="email" name="email" class="form-control w-75" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-3 text_in_card">Nickname</label>
                    <div class="col-sm-8">
                        <input type="text" name="nickname" class="form-control w-75">
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-3 text_in_card">Password*</label>
                    <div class="col-sm-8">
                        <input type="password" name="password" class="form-control w-75" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-3 text_in_card">Confirm Password*</label>
                    <div class="col-sm-8">
                        <input type="password" name="confirm_password" class="form-control w-75" required>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn">Sign Up!</button>
                    <a href="{% url 'login' %}" class="btn">Already have an account? Login</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
