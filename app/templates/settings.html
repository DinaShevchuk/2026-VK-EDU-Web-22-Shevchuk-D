{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="col-8 d-flex flex-column">
    <div class="d-flex gap-3 align-items-center">
        <h1>Settings</h1>
        <a href="{% url 'app:index' %}">Main</a>
    </div>
    <div class="card">
        <div class="card-body">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-success">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="row mb-3">
                    <label class="col-sm-3 text_in_card">Username</label>
                    <div class="col-sm-8">
                        <input type="text" class="form-control w-75" value="{{ user.username }}" disabled>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-3 text_in_card">Email*</label>
                    <div class="col-sm-8">
                        <input type="email" name="email" class="form-control w-75" value="{{ user.email }}" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <label class="col-sm-3 text_in_card">Nickname</label>
                    <div class="col-sm-8">
                        <input type="text" name="nickname" class="form-control w-75" value="{{ user.username }}">
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn">Save changes</button>
                    <a href="{% url 'app:index' %}" class="btn">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
