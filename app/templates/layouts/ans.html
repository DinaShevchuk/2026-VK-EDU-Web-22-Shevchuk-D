{%load static%}
<div class="card w-100 main-card" style="height: auto; width: 18rem;">
    <div class="card-body d-flex flex-column">
        <div class="d-flex" style ="flex-shrink: 0;">
            <div style="display flex; flex-direction: column; align-items: center; flex-shrink: 0;">
                <div class="mb-2">
                    <img src="{% static  'img/ava1.webp'%}" alt="Ava" class="img-fluid">
                </div>
                <input class="form-control mt-2" type="number" value="5" placeholder="Default input"
                aria-label="default input example">
            </div>
            <div class="flex-fill d-flex flex-column ms-3">
                <div class="flex-fill d-flex flex-column">
                    <h5 class="card-title">
                        <a href = "#"> {{ ans.name }} </a>
                    </h5>
                    <p class="card-text">{{ ans.text }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
