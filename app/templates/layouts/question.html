{%load static%}
<article class="card w-100" style="width: 18rem;">
    <div class="card-body">
        <div class="row">
            <div class="col-2">
                <div class="mb-2" style="height: 100px;">
                    <img src="{% static  'img/ava1.webp'%}" alt="Ava" class="img-fluid">
                </div>
                <input class="form-control" type="number" value="5" placeholder="Default input"
                     aria-label="default input example">

            </div>
            <div class="col">
                <h5 class="card-title">
                    <a href = "{% url 'one_question' question.id %}"> {{ question.title }} </a>

                </h5>
                <p class="card-text">{{question.text}}</p>
                <div class="d-flex foot gap-5">
                    <a href="#" class="card-ans">Answer(2)</a>
                    <div class="d-flex align-items-center">
                        <h6 class="card-subtitle">Tegs:</h6>
                        <a href="#" class="card-link">#darkchocolate </a>
                        <a href="#" class="card-link">#antioxidants </a>
                        <a href="#" class="card-link">#richflavor</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</article>
