{% load static %}

<div class="card mt-3">
    <div class="card-body">
        <div class="d-flex">
            <div style="display: flex; flex-direction: column; align-items: center; flex-shrink: 0;">
                <div class="mb-2">
                    <img src="{% static 'img/ava1.webp' %}" alt="Ava" class="img-fluid">
                </div>
                <input class="form-control mt-2" type="number" value="{{ question.rating }}" placeholder="Default input" aria-label="default input example">
            </div>
            <div class="flex-fill d-flex flex-column ms-3">
                <div class="flex-fill d-flex flex-column">
                    <h5 class="card-title">
                        <a href="{% url 'app:question_detail' question.id %}">{{ question.title }}</a>
                    </h5>
                    <p class="card-text">{{ question.text }}</p>
                </div>
                <div class="d-flex gap-3 flex-wrap align-items-center mt-3">
                    <a href="{% url 'app:question_detail' question.id %}">Answer({{ question.answers.count }})</a>
                    <div class="d-flex flex-wrap align-items-center">
                        <h6 class="card-subtitle mb-0">Tags:</h6>
                        {% for tag in question.tags.all %}
                            <a href="{% url 'app:tag' tag_name=tag.name %}" class="card-link">#{{ tag.name }}</a>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
